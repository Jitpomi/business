[package]
name = "server"
version = "0.1.0"
edition = "2021"
default-run = "server"

[dependencies]
aes-gcm = "=0.10.3"
anyhow = "1.0.102"
async-trait = "0.1.89"
axum = "0.8.8"
dog-queue = { git = "https://github.com/Jitpomi/dogrs", rev = "fa1626af0077fc530b29387fc91611b1d07f6adb", default-features = false, features = ["json"] }
dog-auth = "=0.3.1"
dog-auth-local = "0.3.0"
dog-transport = { version = "0.3.0", features = ["http"] }
dog-core = { version = "0.3.0", features = ["serde", "adapters"] }
dog-typedb = "=0.3.6"
dotenvy = "0.15.7"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time", "net", "signal", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11.1"
uuid = { version = "1.11.0", features = ["v4"] }
typedb-driver = "=3.13.6"
typeql = "=3.13.4"

sha2 = "0.10"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
subtle = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
chrono = "0.4"
time = { version = "0.3.55", features = ["large-dates"] }

bcrypt = "0.19"
base64 = "0.22"
rusqlite = { version = "0.43", features = ["bundled"] }
jsonwebtoken = "=10.4.0"
jiff = { version = "1", features = ["tzdb-bundle-always"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
tempfile = "3"
http = "1"
http-body-util = "0.1"

# Reviewed maintained transport; preserves the TypeDB 3.13 protocol.
[patch.crates-io]
typedb-driver = { git = "https://github.com/Jitpomi/typedb-driver", rev = "548a885bc3dee18a3a84fb3092e8b45dc9a4e081" }

# Maintained DogRS 0.3 auth backport; core source is identical to registry 0.3.0.
dog-auth = { git = "https://github.com/Jitpomi/dogrs", rev = "d2756c95569f05ba81e7d6fdc0ceed92acf4d5a1" }
dog-core = { git = "https://github.com/Jitpomi/dogrs", rev = "d2756c95569f05ba81e7d6fdc0ceed92acf4d5a1" }
